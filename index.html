<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Match Manager</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border: #30363d;
      --gold: #d29922;
      --red: #da3633;
      --blue: #1f6beb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .scoreboard {
      background: linear-gradient(145deg, #1f242d, #11151c);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
    }

    .duo-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .duo-names {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 6px 0 16px 0;
    }

    .score-display {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -1px;
    }

    .score-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn-score {
      background-color: #21262d;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-score:hover {
      background-color: #30363d;
    }

    .btn-wicket {
      background-color: var(--red);
      color: white;
      border: none;
    }

    .btn-wicket:hover {
      background-color: #b62320;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      height: 60px;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      box-sizing: border-box;
      resize: vertical;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      flex: 1;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-update {
      background-color: var(--blue);
      color: white;
    }

    .btn-action {
      background-color: #21262d;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .tracker-box {
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
    }

    .current-bowler-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold);
      margin: 8px 0;
    }

    .queue-list {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .queue-badge {
      background-color: #21262d;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      background-color: #1f6beb22;
      color: #58a6ff;
      border: 1px solid #1f6beb44;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏏 Match Manager</h1>
    <div class="subtitle">Scoreboard & Live Rotation</div>

    <div class="scoreboard">
      <div class="duo-title">Batting Duo (Batter & Runner)</div>
      <div id="duoNames" class="duo-names">-- & --</div>
      <div id="scoreDisplay" class="score-display">0 - 0</div>
      <div class="score-controls">
        <button class="btn-score" onclick="addRuns(1)">+1 Run</button>
        <button class="btn-score" onclick="addRuns(2)">+2 Runs</button>
        <button class="btn-score" onclick="addRuns(4)">+4 Runs</button>
        <button class="btn-score" onclick="addRuns(6)">+6 Runs</button>
        <button class="btn-score btn-wicket" onclick="addWicket()">+1 Wicket</button>
      </div>
    </div>

    <div class="controls">
      <div>
        <label for="playerInput">Team Players (comma separated):</label>
        <textarea id="playerInput">Sartaj, David, Khubaib, Gobind, Jerino</textarea>
      </div>
      <div class="button-group">
        <button class="btn-update" onclick="updateTeamOnly()">Update Team Names Only</button>
        <button class="btn-primary" onclick="generateNewMatch()">New Random Match</button>
      </div>
    </div>

    <div class="tracker-box">
      <div class="duo-title">Current Bowler</div>
      <div id="currentBowler" class="current-bowler-name">--</div>
      <button class="btn-action" onclick="nextOver()">Finish Over & Rotate</button>

      <div class="duo-title" style="margin-top: 14px;">Up Next (Excludes Current Bowler)</div>
      <div id="bowlingQueue" class="queue-list">--</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Bowling Order</th>
          <th>Assigned Role</th>
        </tr>
      </thead>
      <tbody id="lineupTable"></tbody>
    </table>
  </div>

  <script>
    let playersList = [];
    let currentBowlingList = [];
    let currentBowlerIndex = 0;
    let rolesMap = {};
    let runs = 0;
    let wickets = 0;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getOrdinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function getPlayersFromInput() {
      const rawInput = document.getElementById('playerInput').value;
      return rawInput.split(',').map(p => p.trim()).filter(p => p.length > 0);
    }

    function generateNewMatch() {
      playersList = getPlayersFromInput();
      if (playersList.length === 0) return alert('Please enter player names.');

      runs = 0;
      wickets = 0;
      updateScoreboard();

      const roles = ['Batter', 'Runner', 'Bowler', 'Wicket Keeper', 'Fielder'];
      const shuffledRoles = shuffle(roles);
      rolesMap = {};

      playersList.forEach((name, index) => {
        rolesMap[name] = shuffledRoles[index % shuffledRoles.length];
      });

      currentBowlingList = shuffle(playersList);
      currentBowlerIndex = 0;

      renderTableAndTrackers();
    }

    function updateTeamOnly() {
      const updatedNames = getPlayersFromInput();
      if (updatedNames.length === 0) return alert('Please enter player names.');

      playersList = updatedNames;

      // Retain existing roles or assign 'Fielder' to new additions
      const roles = ['Batter', 'Runner', 'Bowler', 'Wicket Keeper', 'Fielder'];
      playersList.forEach((name, index) => {
        if (!rolesMap[name]) {
          rolesMap[name] = roles[index % roles.length];
        }
      });

      // Keep bowling order intact, append new players to end
      currentBowlingList = currentBowlingList.filter(name => playersList.includes(name));
      playersList.forEach(name => {
        if (!currentBowlingList.includes(name)) {
          currentBowlingList.push(name);
        }
      });

      renderTableAndTrackers();
    }

    function renderTableAndTrackers() {
      const playerObjects = playersList.map(name => {
        const bowlingPos = currentBowlingList.indexOf(name) + 1;
        return { name, bowlingOrder: bowlingPos, role: rolesMap[name] || 'Fielder' };
      });

      playerObjects.sort((a, b) => a.bowlingOrder - b.bowlingOrder);

      const tbody = document.getElementById('lineupTable');
      tbody.innerHTML = '';

      let batterName = 'None';
      let runnerName = 'None';

      playerObjects.forEach(player => {
        if (player.role === 'Batter') batterName = player.name;
        if (player.role === 'Runner') runnerName = player.name;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${player.name}</strong></td>
          <td>${getOrdinal(player.bowlingOrder)}</td>
          <td><span class="badge">${player.role}</span></td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById('duoNames').innerText = `${batterName} & ${runnerName}`;
      updateTracker();
    }

    function addRuns(amount) {
      runs += amount;
      updateScoreboard();
    }

    function addWicket() {
      wickets += 1;
      updateScoreboard();
    }

    function updateScoreboard() {
      document.getElementById('scoreDisplay').innerText = `${runs} - ${wickets}`;
    }

    function updateTracker() {
      if (currentBowlingList.length === 0) return;

      const current = currentBowlingList[currentBowlerIndex];
      document.getElementById('currentBowler').innerText = current;

      const nextQueue = [];
      for (let i = 1; i < currentBowlingList.length; i++) {
        const idx = (currentBowlerIndex + i) % currentBowlingList.length;
        nextQueue.push(currentBowlingList[idx]);
      }

      const queueContainer = document.getElementById('bowlingQueue');
      queueContainer.innerHTML = '';
      nextQueue.forEach(name => {
        const span = document.createElement('span');
        span.className = 'queue-badge';
        span.innerText = name;
        queueContainer.appendChild(span);
      });
    }

    function nextOver() {
      if (currentBowlingList.length === 0) return;
      currentBowlerIndex = (currentBowlerIndex + 1) % currentBowlingList.length;
      updateTracker();
    }

    window.onload = generateNewMatch;
  </script>

</body>
</html>
