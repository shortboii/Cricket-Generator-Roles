<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Match Manager</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border: #30363d;
      --gold: #d29922;
      --red: #da3633;
      --blue: #1f6beb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .scoreboard {
      background: linear-gradient(145deg, #1f242d, #11151c);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
      position: relative;
    }

    .duo-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .duo-names {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 6px 0 16px 0;
    }

    .score-display {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -1px;
      transition: transform 0.2s ease;
    }

    .score-pop {
      transform: scale(1.2);
    }

    .score-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn-score {
      background-color: #21262d;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn-score:active {
      transform: scale(0.95);
    }

    .btn-wicket {
      background-color: var(--red);
      color: white;
      border: none;
    }

    .btn-wicket:hover {
      background-color: #b62320;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      height: 60px;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      box-sizing: border-box;
      resize: vertical;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      flex: 1;
    }

    .btn-primary { background-color: var(--accent); color: white; }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-update { background-color: var(--blue); color: white; }
    .btn-action { background-color: #21262d; color: var(--text-main); border: 1px solid var(--border); }

    .tracker-box {
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
    }

    .current-bowler-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold);
      margin: 8px 0;
    }

    .queue-list {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .queue-badge {
      background-color: #21262d;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      background-color: #1f6beb22;
      color: #58a6ff;
      border: 1px solid #1f6beb44;
    }

    /* Wicket Break Animation Overlay */
    #wicketAnimation {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 200px;
      z-index: 1000;
    }

    .stump {
      position: absolute;
      bottom: 0;
      width: 14px;
      height: 140px;
      background-color: #e6edf3;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .stump.left { left: 30px; }
    .stump.middle { left: 83px; }
    .stump.right { left: 136px; }

    .bail {
      position: absolute;
      top: 52px;
      width: 48px;
      height: 10px;
      background-color: #d29922;
      border-radius: 3px;
    }

    .bail.left { left: 32px; }
    .bail.right { left: 86px; }

    #wicketAnimation.breaking .stump.middle {
      animation: stumpBreak 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    #wicketAnimation.breaking .bail.left {
      animation: bailLeftFly 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    #wicketAnimation.breaking .bail.right {
      animation: bailRightFly 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes stumpBreak {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(80px) rotate(45deg); opacity: 0; }
    }

    @keyframes bailLeftFly {
      0% { transform: translate(0, 0) rotate(0); opacity: 1; }
      100% { transform: translate(-90px, -120px) rotate(-220deg); opacity: 0; }
    }

    @keyframes bailRightFly {
      0% { transform: translate(0, 0) rotate(0); opacity: 1; }
      100% { transform: translate(90px, -120px) rotate(220deg); opacity: 0; }
    }

    /* Confetti particle styling */
    .confetti {
      position: fixed;
      width: 8px;
      height: 8px;
      z-index: 999;
      border-radius: 2px;
      pointer-events: none;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏏 Match Manager</h1>
    <div class="subtitle">Scoreboard & Live Rotation</div>

    <div class="scoreboard">
      <div class="duo-title">Batting Duo (Batter & Runner)</div>
      <div id="duoNames" class="duo-names">-- & --</div>
      <div id="scoreDisplay" class="score-display">0 - 0</div>
      <div class="score-controls">
        <button class="btn-score" onclick="addRuns(1)">+1 Run</button>
        <button class="btn-score" onclick="addRuns(2)">+2 Runs</button>
        <button class="btn-score" onclick="addRuns(4)">+4 Runs</button>
        <button class="btn-score" onclick="addRuns(6)">+6 Runs</button>
      </div>
      <div class="score-controls" style="margin-top: 10px;">
        <button class="btn-score btn-wicket" onclick="triggerWicketAnimation('Batter')">Out: Batter</button>
        <button class="btn-score btn-wicket" onclick="triggerWicketAnimation('Runner')">Out: Runner</button>
      </div>
    </div>

    <!-- Animated Wickets -->
    <div id="wicketAnimation">
      <div class="stump left"></div>
      <div class="stump middle"></div>
      <div class="stump right"></div>
      <div class="bail left"></div>
      <div class="bail right"></div>
    </div>

    <div class="controls">
      <div>
        <label for="playerInput">Team Players (comma separated):</label>
        <textarea id="playerInput">Sartaj, David, Khubaib, Gobind, Jerino</textarea>
      </div>
      <div class="button-group">
        <button class="btn-update" onclick="updateTeamOnly()">Update Team Names Only</button>
        <button class="btn-primary" onclick="generateNewMatch()">New Random Match</button>
      </div>
    </div>

    <div class="tracker-box">
      <div class="duo-title">Current Bowler</div>
      <div id="currentBowler" class="current-bowler-name">--</div>
      <button class="btn-action" onclick="nextOver()">Finish Over & Rotate</button>

      <div class="duo-title" style="margin-top: 14px;">Up Next (Excludes Current Bowler)</div>
      <div id="bowlingQueue" class="queue-list">--</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Bowling Order</th>
          <th>Assigned Role</th>
        </tr>
      </thead>
      <tbody id="lineupTable"></tbody>
    </table>
  </div>

  <script>
    let playersList = [];
    let currentBowlingList = [];
    let currentBowlerIndex = 0;
    let rolesMap = {};
    let runs = 0;
    let wickets = 0;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getOrdinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function getPlayersFromInput() {
      const rawInput = document.getElementById('playerInput').value;
      return rawInput.split(',').map(p => p.trim()).filter(p => p.length > 0);
    }

    function generateNewMatch() {
      playersList = getPlayersFromInput();
      if (playersList.length < 2) return alert('Please enter at least 2 players.');

      runs = 0;
      wickets = 0;
      updateScoreboard();

      currentBowlingList = shuffle(playersList);
      currentBowlerIndex = 0;

      // Assign roles: 1 Batter, 1 Runner, remaining get Wicket Keeper/Fielder
      rolesMap = {};
      rolesMap[currentBowlingList[0]] = 'Batter';
      rolesMap[currentBowlingList[1]] = 'Runner';

      for (let i = 2; i < currentBowlingList.length; i++) {
        rolesMap[currentBowlingList[i]] = (i === 2) ? 'Wicket Keeper' : 'Fielder';
      }

      renderTableAndTrackers();
    }

    function updateTeamOnly() {
      const updatedNames = getPlayersFromInput();
      if (updatedNames.length < 2) return alert('Please enter at least 2 players.');

      playersList = updatedNames;

      // Retain or assign fallback roles
      playersList.forEach(name => {
        if (!rolesMap[name]) rolesMap[name] = 'Fielder';
      });

      // Maintain order for existing players, push new players to the end
      currentBowlingList = currentBowlingList.filter(name => playersList.includes(name));
      playersList.forEach(name => {
        if (!currentBowlingList.includes(name)) currentBowlingList.push(name);
      });

      renderTableAndTrackers();
    }

    function renderTableAndTrackers() {
      const playerObjects = playersList.map(name => {
        const bowlingPos = currentBowlingList.indexOf(name) + 1;
        return { name, bowlingOrder: bowlingPos, role: rolesMap[name] || 'Fielder' };
      });

      playerObjects.sort((a, b) => a.bowlingOrder - b.bowlingOrder);

      const tbody = document.getElementById('lineupTable');
      tbody.innerHTML = '';

      let batterName = 'None';
      let runnerName = 'None';

      playerObjects.forEach(player => {
        if (player.role === 'Batter') batterName = player.name;
        if (player.role === 'Runner') runnerName = player.name;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${player.name}</strong></td>
          <td>${getOrdinal(player.bowlingOrder)}</td>
          <td><span class="badge">${player.role}</span></td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById('duoNames').innerText = `${batterName} & ${runnerName}`;
      updateTracker();
    }

    function addRuns(amount) {
      runs += amount;
      updateScoreboard();
      animateScorePop();
      if (amount === 6) triggerConfetti();
    }

    function animateScorePop() {
      const scoreEl = document.getElementById('scoreDisplay');
      scoreEl.classList.add('score-pop');
      setTimeout(() => scoreEl.classList.remove('score-pop'), 200);
    }

    function triggerWicketAnimation(targetRole) {
      const anim = document.getElementById('wicketAnimation');
      anim.style.display = 'block';
      anim.classList.add('breaking');

      setTimeout(() => {
        playerOut(targetRole);
        anim.classList.remove('breaking');
        anim.style.display = 'none';
      }, 650);
    }

    function playerOut(outRole) {
      runs = 0;
      wickets += 1;
      updateScoreboard();

      if (currentBowlingList.length === 0) return;

      const bowlerName = currentBowlingList[currentBowlerIndex];
      let outPlayerName = '';

      // Find who was in the targeted role (Batter or Runner)
      for (let p in rolesMap) {
        if (rolesMap[p] === outRole) {
          outPlayerName = p;
          break;
        }
      }

      if (outPlayerName && bowlerName) {
        // Swap out player to Fielder, put Bowler into the out role (Batter/Runner)
        rolesMap[outPlayerName] = 'Fielder';
        rolesMap[bowlerName] = outRole;
      }

      // Rotate bowler position to the next player
      currentBowlerIndex = (currentBowlerIndex + 1) % currentBowlingList.length;

      renderTableAndTrackers();
    }

    function updateScoreboard() {
      document.getElementById('scoreDisplay').innerText = `${runs} - ${wickets}`;
    }

    function triggerConfetti() {
      for (let i = 0; i < 25; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.top = '0px';
        piece.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        piece.style.animation = `confettiFall ${1 + Math.random() * 1.5}s linear forwards`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2500);
      }
    }

    function updateTracker() {
      if (currentBowlingList.length === 0) return;

      const current = currentBowlingList[currentBowlerIndex];
      document.getElementById('currentBowler').innerText = current;

      const nextQueue = [];
      for (let i = 1; i < currentBowlingList.length; i++) {
        const idx = (currentBowlerIndex + i) % currentBowlingList.length;
        nextQueue.push(currentBowlingList[idx]);
      }

      const queueContainer = document.getElementById('bowlingQueue');
      queueContainer.innerHTML = '';
      nextQueue.forEach(name => {
        const span = document.createElement('span');
        span.className = 'queue-badge';
        span.innerText = name;
        queueContainer.appendChild(span);
      });
    }

    function nextOver() {
      if (currentBowlingList.length === 0) return;
      currentBowlerIndex = (currentBowlerIndex + 1) % currentBowlingList.length;
      updateTracker();
    }

    window.onload = generateNewMatch;
  </script>

</body>
</html>
