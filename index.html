<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Lineup & Role Randomizer</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary: #1b4d3e;
      --primary-hover: #123429;
      --text: #1f2937;
      --border: #e5e7eb;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.75rem;
      text-align: center;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
      display: block;
    }

    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      box-sizing: border-box;
      resize: vertical;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #f3f4f6;
      color: var(--text);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #f9fafb;
      color: var(--primary);
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      background-color: #e0e7ff;
      color: #3730a3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏏 Cricket Lineup Randomizer</h1>

    <div class="controls">
      <div>
        <label for="playerInput">Players (separated by comma):</label>
        <textarea id="playerInput">Sartaj, David, Khubaib, Gobind, Jerino</textarea>
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="generateLineup()">Shuffle & Assign Roles</button>
        <button class="btn-secondary" onclick="resetDefaults()">Reset</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Player Name</th>
            <th>Bowling Order</th>
            <th>Assigned Role</th>
          </tr>
        </thead>
        <tbody id="lineupTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const availableRoles = ['Bowler', 'Wicket Keeper', 'Batter', 'Runner'];

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getOrdinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function generateLineup() {
      const rawInput = document.getElementById('playerInput').value;
      const players = rawInput.split(',').map(p => p.trim()).filter(p => p.length > 0);

      if (players.length === 0) {
        alert('Please enter at least one player name.');
        return;
      }

      const bowlingShuffled = shuffle(players);
      const rolesShuffled = shuffle(availableRoles);

      const playerList = players.map((name, index) => {
        const bowlingPos = bowlingShuffled.indexOf(name) + 1;
        const role = rolesShuffled[index % rolesShuffled.length];

        return { name, bowlingOrder: bowlingPos, role };
      });

      playerList.sort((a, b) => a.bowlingOrder - b.bowlingOrder);

      const tbody = document.getElementById('lineupTable');
      tbody.innerHTML = '';

      playerList.forEach(player => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${player.name}</strong></td>
          <td>${getOrdinal(player.bowlingOrder)}</td>
          <td><span class="badge">${player.role}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    function resetDefaults() {
      document.getElementById('playerInput').value = 'Sartaj, David, Khubaib, Gobind, Jerino';
      generateLineup();
    }

    window.onload = generateLineup;
  </script>

</body>
</html>
